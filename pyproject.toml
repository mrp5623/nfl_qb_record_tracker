[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "nfl-qb-tracker"
version = "0.1.0"
requires-python = ">= 3.13"

dependencies = [
  "nflreadpy",
  "polars",
  "psycopg[binary]",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.pytest.ini_options] 
testpaths = ["ingest/tests"]


